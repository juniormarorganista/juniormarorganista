name: Generate Snake Animation

on:
  workflow_dispatch:          # permite rodar manualmente

  push:
    branches: [main]          # regenera sempre que o perfil muda

  schedule:
    # Dois horarios por dia, em minuto quebrado e longe da virada da hora.
    # A fila do GitHub Actions atrasa -- e as vezes descarta -- agendamentos
    # nos horarios cheios, e "0 0 * * *" e o slot mais disputado de todos.
    # Com duas janelas por dia, uma descartada nao deixa o SVG parado.
    - cron: "37 5 * * *"      # 02:37 BRT
    - cron: "37 17 * * *"     # 14:37 BRT

permissions:
  contents: write

# Uma execucao por vez: se um push coincidir com o agendamento, a mais
# recente vence em vez de as duas disputarem a branch output.
concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # As cores vao na query string de cada saida. A acao v3 aceita
      # apenas tres entradas -- github_user_name, github_token e outputs --
      # e nao existe entrada "args": passar uma sobrescreve o comando do
      # container e quebra a execucao.
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF5733&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF5733
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation"
